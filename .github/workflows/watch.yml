name: Release watchtower

on:
  push:
  schedule:
    - cron: '0 3 * * *'

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.latest.outputs.ver }}
      need_build: ${{ steps.check.outputs.exists == 'false' }}
    steps:
      - name: Get latest tag
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION=$(
            gh api --paginate 'repos/gwsw/less/git/refs/tags?per_page=100' \
              --jq '.[].ref' |
            sed -nE 's|^refs/tags/v([0-9]+)$|\1|p' |
            sort -n |
            tail -n 1
          )

          if [[ ! "$VERSION" =~ ^[0-9]+$ ]]; then
            echo '::error::No numeric less release tag was returned by GitHub'
            exit 1
          fi

          echo "ver=${VERSION}" >> "$GITHUB_OUTPUT"
      - name: Check if the release asset already exists
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.latest.outputs.ver }}
        run: |
          set -euo pipefail
          ASSET_EXISTS=$(gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
            --jq ".[] | select(.tag_name == \"v${VERSION}\") | ([.assets[].name] | contains([\"less\", \"lessecho\", \"less-aarch64\", \"lessecho-aarch64\"]))")

          if [[ "$ASSET_EXISTS" == 'true' ]]; then
            echo 'exists=true' >> "$GITHUB_OUTPUT"
          else
            echo 'exists=false' >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: [check]
    if: needs.check.outputs.need_build == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-26.04
            asset_suffix: ''
            expected_file_arch: x86-64
          - arch: aarch64
            runner: ubuntu-26.04-arm
            asset_suffix: -aarch64
            expected_file_arch: ARM aarch64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Build static binaries
        env:
          ASSET_SUFFIX: ${{ matrix.asset_suffix }}
          EXPECTED_FILE_ARCH: ${{ matrix.expected_file_arch }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools make autoconf libncurses-dev file
          curl --fail --show-error --silent --location \
            "https://github.com/gwsw/less/archive/v${VERSION}.tar.gz" |
            tar --strip-components=1 -zx
          make -f Makefile.aut
          CFLAGS=-Os LDFLAGS=-static ./configure
          CC=musl-gcc make -j
          strip less lessecho

          file less lessecho
          file less | grep -Fq "$EXPECTED_FILE_ARCH"
          file lessecho | grep -Fq "$EXPECTED_FILE_ARCH"
          ./less --version

          mkdir release
          install -m 0755 less "release/less${ASSET_SUFFIX}"
          install -m 0755 lessecho "release/lessecho${ASSET_SUFFIX}"
      - name: Store release assets
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.arch }}
          path: release/
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [check, build]
    if: needs.check.outputs.need_build == 'true'
    permissions:
      contents: write
    steps:
      - name: Collect release assets
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "v${VERSION}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "v${VERSION}" dist/* \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "v${VERSION}" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "v${VERSION}" \
              --notes 'This build is automated via GitHub Actions. If you find any errors, please open an issue and let me know.'
          fi
